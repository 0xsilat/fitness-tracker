services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
    volumes:
      - fitness_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://fitness:fitness@db:5432/fitness?sslmode=disable
      HTTP_ADDR: :8080
      TZ: Europe/Lisbon
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  fitness_data:
